name: inspiration-wallet-server

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - inspiration_backend
    security_opt:
      - no-new-privileges:true

  api:
    image: ${BACKEND_IMAGE:-inspiration-wallet-server:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ADMIN_API_KEY_HASH: ${ADMIN_API_KEY_HASH:-}
      PROVIDER_SECRETS_ENCRYPTION_KEY: ${PROVIDER_SECRETS_ENCRYPTION_KEY:-}
      IMAGE_RESULT_STORE_DIR: /var/lib/inspiration/image-results
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-tencent-cos}
      STORAGE_SIGNED_URL_EXPIRES_SECONDS: ${STORAGE_SIGNED_URL_EXPIRES_SECONDS:-3600}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
    volumes:
      - image_result_data:/var/lib/inspiration/image-results
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - inspiration_backend
    security_opt:
      - no-new-privileges:true

  worker:
    image: ${BACKEND_IMAGE:-inspiration-wallet-server:local}
    restart: unless-stopped
    init: true
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PROVIDER_SECRETS_ENCRYPTION_KEY: ${PROVIDER_SECRETS_ENCRYPTION_KEY:-}
      WORKER_HEALTH_FILE: /tmp/inspiration-worker-health
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-tencent-cos}
      STORAGE_SIGNED_URL_EXPIRES_SECONDS: ${STORAGE_SIGNED_URL_EXPIRES_SECONDS:-3600}
      OSS_REGION: ${OSS_REGION:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const p=process.env.WORKER_HEALTH_FILE;const age=Date.now()-fs.statSync(p).mtimeMs;if(age>60000)process.exit(1)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - inspiration_backend
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?CADDY_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - inspiration_backend
    security_opt:
      - no-new-privileges:true

networks:
  inspiration_backend:
    name: inspiration_backend
    driver: bridge

volumes:
  postgres_data:
    name: inspiration_wallet_postgres_data
  caddy_data:
    name: inspiration_wallet_caddy_data
  caddy_config:
    name: inspiration_wallet_caddy_config
  image_result_data:
    name: inspiration_wallet_image_result_data
